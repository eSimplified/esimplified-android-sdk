name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      previous: ${{ steps.version.outputs.previous }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the version and decide whether it is new
        id: version
        run: |
          version=$(sed -n 's/.*coordinates("io.github.esimplified", "android-sdk", "\(.*\)").*/\1/p' sdk/build.gradle.kts)

          if [ -z "$version" ]; then
            echo "::error file=sdk/build.gradle.kts::Could not read the published coordinate"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

          if git rev-parse "refs/tags/$version" >/dev/null 2>&1 || git rev-parse "refs/tags/v$version" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$version is already released. Nothing to do."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$version has no tag yet. Releasing it."
          fi

          previous=$(.github/scripts/previous-tag.sh)
          echo "previous=$previous" >> "$GITHUB_OUTPUT"

  publish:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    uses: ./.github/workflows/publish.yml
    secrets: inherit

  release:
    needs: [check, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write the release notes
        id: notes
        run: |
          {
            echo 'body<<RELEASE_NOTES_EOF'
            .github/scripts/release-notes.sh "${{ needs.check.outputs.version }}" "${{ needs.check.outputs.previous }}"
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Tag and publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.check.outputs.version }}
          body: ${{ steps.notes.outputs.body }}
